# SIKEMAS Nginx Production Configuration - Kecamatan Caringin
# Path: /etc/nginx/sites-available/sikemas.caringin.go.id

# Rate Limiting Zones (Section 15: Keamanan)
limit_req_zone $binary_remote_addr zone=sikemas_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=sikemas_upload:10m rate=10r/m;

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name sikemas.caringin.go.id;
    return 301 https://$host$request_uri;
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sikemas.caringin.go.id;

    root /var/www/sikemas/public;
    index index.php index.html;

    # SSL Certificates (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/sikemas.caringin.go.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sikemas.caringin.go.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers (Section 15)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Maximum Upload Size (5MB per SPJ / Lampiran requirement)
    client_max_body_size 10M;

    # Charset
    charset utf-8;

    # Storage Public Access (^~ ensures this prefix takes precedence over regex static assets)
    location ^~ /storage/ {
        alias /var/www/sikemas/storage/app/public/;
        try_files $uri $uri/ /index.php?$query_string;
        access_log off;
    }

    # Static Assets Caching & Compression
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    # Rate Limiting on Login Endpoint
    location = /login {
        limit_req zone=sikemas_login burst=3 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Rate Limiting on SPJ Upload & Aset Store
    location ~ ^/(spj|aset)/store {
        limit_req zone=sikemas_upload burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Main Application Route
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # PHP-FPM Configuration
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 120s;
    }

    # Deny Hidden Files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Deny Direct Access to Backup Directory
    location ^~ /backup {
        deny all;
        return 404;
    }

    # Logging
    access_log /var/log/nginx/sikemas_access.log;
    error_log  /var/log/nginx/sikemas_error.log warn;
}
