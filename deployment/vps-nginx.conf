server {
    server_name sikemas.initd.web.id;
    root /var/www/sikemas/public;

    index index.php index.html;
    charset utf-8;
    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Storage public access with highest prefix priority (^~)
    location ^~ /storage/ {
        alias /var/www/sikemas/storage/app/public/;
        try_files $uri $uri/ /index.php?$query_string;
        access_log off;
    }

    # Static Assets Caching & Compression
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ^~ /backup {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/sikemas_access.log;
    error_log  /var/log/nginx/sikemas_error.log warn;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sikemas.initd.web.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sikemas.initd.web.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = sikemas.initd.web.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name sikemas.initd.web.id;
    return 404; # managed by Certbot
}
